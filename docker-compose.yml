services:
  postgres:
    image: postgres:15-alpine3.23
    container_name: postgres-llmgateway
    restart: always

    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB: "llmgateway"

    ports:
      - "5559:5432"

    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis-llmgateway
    restart: always
    ports:
      - "6354:6379"
    volumes:
      - redis:/data

volumes:
  postgres:
    driver: local
  redis:
    driver: local
